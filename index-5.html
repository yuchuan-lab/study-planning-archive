<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#69704d">
<title>讀書進度工具</title>
<style>
:root{
  --paper:#f4f0e4;
  --paper2:#ebe5d5;
  --olive:#69704d;
  --dark:#4f563b;
  --ink:#35372d;
  --line:#c9c4b4;
  --white:#faf8f1;
  --muted:#77786d;
  --study:#dfe5ca;
  --flex:#e8e0cc;
  --rest:#e4e2dc;
  --exercise:#d5dfd0;
  --other:#ddd8cc;
  --weight-bg:#e9e1cf;
  --weight-line:#b9ad92;
  --weight-accent:#817354;
  --subject-bg:#e1e6d4;
  --subject-line:#b5bea0;
  --subject-accent:#69704d;
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif
}
button,input,select{
  font:inherit
}
button{
  cursor:pointer
}
header{
  padding:24px 5vw 16px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px
}
.brand{
  display:flex;
  align-items:center;
  gap:10px
}
.logo{
  font-size:25px;
  color:var(--olive)
}
h1{
  font:500 21px Georgia,"Times New Roman",serif;
  letter-spacing:.08em;
  margin:0
}
.sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}
nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}
nav button,.btn{
  border:1px solid var(--line);
  background:transparent;
  color:var(--dark);
  padding:8px 12px;
  border-radius:4px
}
nav button.active,.btn.primary{
  background:var(--olive);
  color:white;
  border-color:var(--olive)
}
main{
  max-width:1280px;
  margin:auto;
  padding:26px 5vw 60px
}
.page{
  display:none
}
.page.active{
  display:block
}
.grid{
  display:grid;
  gap:16px
}
.two{
  grid-template-columns:repeat(2,minmax(0,1fr))
}
.three{
  grid-template-columns:repeat(3,minmax(0,1fr))
}
.card{
  background:rgba(250,248,241,.72);
  border:1px solid var(--line);
  border-radius:6px;
  padding:19px
}
.card h2{
  font-size:15px;
  font-weight:600;
  margin:0 0 14px;
  color:var(--dark)
}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px
}
input,select{
  width:100%;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:4px;
  padding:9px;
  color:var(--ink)
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}
.row>*{
  flex:1
}
.big{
  font:40px Georgia,serif;
  color:var(--olive);
  line-height:1
}
.metric small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px
}
.muted{
  color:var(--muted)
}
.small{
  font-size:11px
}
.notice{
  padding:11px 13px;
  background:var(--paper2);
  border-left:3px solid var(--olive);
  font-size:13px;
  margin-bottom:14px
}
.danger{
  border-left-color:#956b55
}
.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:13px;
  flex-wrap:wrap
}
.status{
  font-size:11px;
  color:var(--muted);
  text-align:right;
  margin-top:8px
}
.status.saved{
  color:var(--olive)
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}
th,td{
  border-bottom:1px solid var(--line);
  padding:8px 6px;
  text-align:left
}
th{
  font-size:11px;
  color:var(--muted);
  font-weight:500
}
.schedule{
  overflow:auto;
  user-select:none;
  -webkit-user-select:none
}
.schedule table{
  min-width:850px
}
.schedule th,.schedule td{
  height:30px;
  padding:2px 4px;
  text-align:center
}
.schedule th:first-child,.schedule td:first-child{
  width:64px;
  text-align:right;
  padding-right:8px;
  color:var(--muted);
  font-size:11px
}
.schedule th.day-header{
  padding:7px 4px 6px;
  line-height:1.35
}
.day-name{
  display:block;
  font-size:12px;
  color:var(--dark);
  font-weight:600
}
.day-total{
  display:block;
  margin-top:2px;
  font-size:10px;
  color:var(--olive);
  font-family:Georgia,serif;
  font-weight:600
}
.slot{
  width:100%;
  height:26px;
  border:1px solid rgba(80,80,70,.08);
  border-radius:3px;
  background:transparent;
  font-size:10px;
  color:var(--ink);
  touch-action:none;
  transition:.08s
}
.slot.study{
  background:var(--study)
}
.slot.flex{
  background:var(--flex)
}
.slot.rest{
  background:var(--rest)
}
.slot.exercise{
  background:var(--exercise)
}
.slot.other{
  background:var(--other)
}
.slot.selected{
  outline:2px solid var(--olive);
  outline-offset:-2px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)
}
.palette{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px
}
.palette button{
  border:1px solid var(--line);
  padding:6px 9px;
  border-radius:4px;
  background:var(--white);
  font-size:12px
}
.palette button.selected{
  outline:2px solid var(--olive);
  outline-offset:1px
}
.selection-info{
  font-size:11px;
  color:var(--muted);
  margin-bottom:12px
}
.subject-form{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1.2fr auto;
  gap:7px;
  align-items:end
}
.score-form{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:7px;
  align-items:end
}
.delete{
  border:0;
  background:none;
  color:#8a6858;
  font-size:17px
}
.empty{
  text-align:center;
  padding:25px;
  color:var(--muted)
}
.weight-section{
  background:var(--weight-bg);
  border:1px solid var(--weight-line);
  border-radius:6px;
  padding:17px;
  margin-bottom:24px
}
.weight-section h3{
  color:var(--weight-accent)!important
}
.weight-section .notice{
  background:rgba(250,248,241,.48);
  border-left-color:var(--weight-accent)
}
.weight-section input{
  background:#f8f4e9
}
.weight-section .total-table{
  background:rgba(250,248,241,.38);
  border:1px solid rgba(129,115,84,.25)
}
.weight-section .total-table th{
  background:rgba(129,115,84,.10)
}
.total-table th,
.total-table td{
  text-align:center
}
.total-table th:first-child,
.total-table td:first-child{
  text-align:left
}
.total-table .ratio{
  font-family:Georgia,serif;
  color:var(--weight-accent)
}
.total-table .hours{
  font-family:Georgia,serif;
  color:var(--dark);
  font-weight:600
}
.sum-row td{
  font-weight:600;
  background:rgba(129,115,84,.10)
}
.week-hours{
  font-family:Georgia,serif;
  color:var(--weight-accent);
  font-weight:600
}
.subject-section{
  background:rgba(225,230,212,.40);
  border:1px solid var(--subject-line);
  border-radius:6px;
  padding:17px
}
.subject-section h3{
  color:var(--subject-accent)!important
}
.subject-section .notice{
  background:rgba(250,248,241,.58);
  border-left-color:var(--subject-accent)
}
.subject-section table{
  background:rgba(250,248,241,.35)
}
.subject-section thead th{
  background:rgba(105,112,77,.09)
}
.plan-wrapper{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:6px
}
.plan-calendar{
  min-width:1050px;
  border:1px solid var(--line);
  background:rgba(250,248,241,.55);
  border-radius:6px;
  overflow:hidden
}
.plan-week{
  border-bottom:1px solid var(--line)
}
.plan-week:last-child{
  border-bottom:0
}
.plan-week-title{
  padding:9px 12px;
  background:rgba(235,229,213,.72);
  border-bottom:1px solid var(--line);
  color:var(--dark);
  font-size:12px;
  font-weight:600
}
.plan-grid{
  display:grid;
  grid-template-columns:64px repeat(7,minmax(0,1fr))
}
.plan-corner{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(235,229,213,.42)
}
.plan-day-header{
  min-height:54px;
  padding:7px 5px;
  text-align:center;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(250,248,241,.82)
}
.plan-day-header:last-child{
  border-right:0
}
.plan-day-header .weekday{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--dark)
}
.plan-day-header .date{
  display:block;
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  font-family:Georgia,serif
}
.plan-day-header.outside{
  opacity:.45
}
.plan-time-axis{
  position:relative;
  border-right:1px solid var(--line);
  background:rgba(235,229,213,.35)
}
.plan-time-label{
  position:absolute;
  right:7px;
  font-size:9px;
  color:var(--muted);
  font-family:Georgia,serif;
  white-space:nowrap
}
.plan-days-area{
  grid-column:2 / 9;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr))
}
.plan-day-column{
  position:relative;
  border-right:1px solid var(--line);
  background:rgba(250,248,241,.34)
}
.plan-day-column:last-child{
  border-right:0
}
.plan-day-column.outside{
  background:rgba(235,229,213,.18)
}
.plan-grid-area{
  position:relative;
  min-height:480px;
  overflow:hidden
}
.plan-hour-line{
  position:absolute;
  left:0;
  right:0;
  border-top:1px solid rgba(105,112,77,.22);
  pointer-events:none;
  z-index:1
}
.plan-half-line{
  position:absolute;
  left:0;
  right:0;
  border-top:1px dashed rgba(105,112,77,.10);
  pointer-events:none;
  z-index:1
}
/*
  時間軸事件色塊：
  一個 event 就是一個完整色塊。
  色塊的 top / height 直接依實際開始與結束時間計算，
  並放在格線上方，因此中間的整點／半點線不會
  把同一個事件視覺上切成數格。
*/
.plan-event{
  position:absolute;
  left:5px;
  right:5px;
  min-height:8px;
  padding:5px 6px;
  border-radius:4px;
  border:1px solid rgba(79,86,59,.16);
  overflow:hidden;
  z-index:10;
  box-shadow:0 1px 2px rgba(53,55,45,.06);
  pointer-events:none;
  isolation:isolate
}
.plan-event b{
  display:block;
  font-size:10px;
  font-family:Georgia,"Times New Roman",serif;
  color:var(--dark);
  margin-bottom:2px;
  position:relative;
  z-index:2
}
.plan-event .event-name{
  display:block;
  font-size:11px;
  font-weight:600;
  line-height:1.35;
  position:relative;
  z-index:2
}
.plan-event .event-type{
  display:block;
  margin-top:2px;
  font-size:9px;
  color:var(--muted);
  line-height:1.3;
  position:relative;
  z-index:2
}
.plan-event.subject-0{background:#dfe5ca}
.plan-event.subject-1{background:#e5dccb}
.plan-event.subject-2{background:#d7e1dc}
.plan-event.subject-3{background:#e1d9df}
.plan-event.subject-4{background:#e7dfc9}
.plan-event.subject-5{background:#d9dfcc}
.plan-event.subject-6{background:#ddd9e3}
.plan-event.subject-7{background:#e4dfd3}
.plan-event.subject-8{background:#d8e0d7}
.plan-event.subject-9{background:#e4dcd1}
.plan-event.subject-other{background:#ddd8cc}
.plan-blank{
  min-height:40px;
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:11px
}
.plan-legend{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:10px;
  color:var(--muted)
}
.plan-legend-item{
  display:flex;
  align-items:center;
  gap:4px
}
.plan-legend-dot{
  width:10px;
  height:10px;
  border-radius:2px;
  border:1px solid rgba(79,86,59,.12)
}
.plan-note{
  margin-top:10px;
  font-size:10px;
  color:var(--muted)
}
.backup-box{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line)
}
.backup-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.file-input{
  display:none
}
@media(max-width:850px){
  header{
    align-items:flex-start;
    flex-direction:column
  }
  .two,.three{
    grid-template-columns:1fr
  }
  .subject-form{
    grid-template-columns:1fr 1fr
  }
  .score-form{
    grid-template-columns:1fr 1fr
  }
}
@media(max-width:520px){
  main{
    padding:20px 4vw 50px
  }
  .subject-form,
  .score-form{
    grid-template-columns:1fr
  }
  nav{
    width:100%
  }
  nav button{
    flex:1
  }
}

/* 排程起點選擇 */
.plan-start{
  margin-bottom:16px;
  padding:13px 15px;
  background:var(--paper2);
  border:1px solid var(--line);
  border-radius:4px
}
.plan-start-title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:9px
}
.plan-start-option{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  font-size:13px;
  color:var(--ink);
  margin:0 0 8px;
  cursor:pointer
}
.plan-start-option input[type="radio"]{
  width:auto;
  padding:0;
  margin:0;
  accent-color:var(--olive)
}
.plan-start-option input[type="date"]{
  width:auto;
  min-width:150px
}
.plan-start-option.dim input[type="date"]{
  opacity:.55
}
#planStartInfo{
  margin-top:2px
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🕯️</div>
    <div>
      <h1>讀書進度工具</h1>
      <div class="sub">Study Planning Archive</div>
    </div>
  </div>
  <nav>
    <button class="active" data-page="home">總覽</button>
    <button data-page="routine">每週作息</button>
    <button data-page="subjects">科目配置</button>
    <button data-page="planner">自動排程</button>
  </nav>
</header>
<main>
<section id="home" class="page active">
  <div class="grid three">
    <div class="card metric">
      <small>距離考試</small>
      <div class="big" id="daysLeft">—</div>
      <div class="muted">天</div>
    </div>
    <div class="card metric">
      <small>剩餘週數</small>
      <div class="big" id="weeksLeft">—</div>
      <div class="muted">週</div>
    </div>
    <div class="card metric">
      <small>每週可讀書</small>
      <div class="big" id="weeklyStudy">0</div>
      <div class="muted">小時</div>
    </div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card">
      <h2>考試設定</h2>
      <div class="row">
        <div>
          <label>起始日期</label>
          <input id="startDate" type="date">
        </div>
        <div>
          <label>考試日期</label>
          <input id="examDate" type="date">
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="saveDates">
          儲存設定
        </button>
      </div>
      <div id="dateInfo" class="small muted" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>目前計畫摘要</h2>
      <div id="summary"></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>資料保存與備份</h2>
    <div class="backup-actions">
      <button class="btn primary" id="exportData">
        ↓ 匯出進度備份
      </button>
      <button class="btn" id="importData">
        ↑ 匯入進度備份
      </button>
      <button class="btn" id="clearData">
        清除全部資料
      </button>
      <input
        id="backupFile"
        class="file-input"
        type="file"
        accept=".json,application/json">
    </div>
    <div id="saveStatus" class="status saved">
      ✓ 資料已自動保存
    </div>
  </div>
</section>

<section id="routine" class="page">
  <div class="card">
    <h2>每週作息表</h2>
    <div class="palette" id="palette">
      <button class="selected" data-kind="study">
        讀書
      </button>
      <button data-kind="meal">
        吃飯
      </button>
      <button data-kind="exercise">
        運動
      </button>
      <button data-kind="flex">
        彈性時間
      </button>
      <button data-kind="rest">
        休息
      </button>
      <button data-kind="other">
        其他
      </button>
    </div>
    <div class="selection-info">
      已選取：
      <b id="selectedCount">0</b>
      格
    </div>
    <div class="schedule">
      <table>
        <thead>
          <tr>
            <th>時間</th>
            <th class="day-header">
              <span class="day-name">一</span>
              <span class="day-total" id="dayTotal0">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">二</span>
              <span class="day-total" id="dayTotal1">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">三</span>
              <span class="day-total" id="dayTotal2">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">四</span>
              <span class="day-total" id="dayTotal3">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">五</span>
              <span class="day-total" id="dayTotal4">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">六</span>
              <span class="day-total" id="dayTotal5">0.0 h</span>
            </th>
            <th class="day-header">
              <span class="day-name">日</span>
              <span class="day-total" id="dayTotal6">0.0 h</span>
            </th>
          </tr>
        </thead>
        <tbody id="routineBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn" id="clearSelection">
        清除選取
      </button>
      <button class="btn" id="clearRoutine">
        清除全部
      </button>
      <button class="btn primary" id="saveRoutine">
        儲存作息
      </button>
    </div>
    <div class="status saved">
      ✓ 作息修改會自動保存
    </div>
    <div class="notice" style="margin-top:14px">
      每週可排讀書時間：
      <b id="routineTotal">0 小時</b>
    </div>
  </div>
</section>

<section id="subjects" class="page">
  <div class="card">
    <h2>科目配置</h2>
    <div class="weight-section">
      <h3 style="font-size:13px;margin:0 0 10px">
        ① 考試科目配分總表
      </h3>
      <div class="score-form">
        <div>
          <label>科目</label>
          <input id="wName" placeholder="例如：民法">
        </div>
        <div>
          <label>配分</label>
          <input
            id="wScore"
            type="number"
            min="0"
            step="1"
            placeholder="100">
        </div>
        <button class="btn primary" id="addWeight">
          新增科目
        </button>
      </div>
      <div style="overflow:auto;margin-top:14px">
        <table class="total-table">
          <thead>
            <tr>
              <th>科目</th>
              <th>配分</th>
              <th>配分比例</th>
              <th>準備期間總時數</th>
              <th>每週時數</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="weightBody"></tbody>
        </table>
      </div>
      <div
        id="weightSummary"
        class="small muted"
        style="margin-top:9px">
      </div>
    </div>

    <div class="subject-section">
      <h3 style="font-size:13px;margin:0 0 10px">
        ② 現階段科目配置
      </h3>
      <div class="subject-form">
        <div>
          <label>科目</label>
          <input id="sName" placeholder="例如：民法">
        </div>
        <div>
          <label>每週時數</label>
          <input
            id="sHours"
            type="number"
            min=".5"
            step=".5"
            placeholder="6">
        </div>
        <div>
          <label>每次時數</label>
          <input
            id="sSession"
            type="number"
            min=".5"
            step=".5"
            placeholder="3">
        </div>
        <div>
          <label>類型</label>
          <select id="sType">
            <option>複習</option>
            <option>上課</option>
            <option>寫題目</option>
            <option>背誦</option>
            <option>其他</option>
          </select>
        </div>
        <button class="btn primary" id="addSubject">
          新增
        </button>
      </div>
      <div style="overflow:auto;margin-top:18px">
        <table>
          <thead>
            <tr>
              <th>科目</th>
              <th>每週</th>
              <th>每次</th>
              <th>每週次數</th>
              <th>考前預估</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="subjectBody"></tbody>
        </table>
      </div>
      <div id="subjectCapacityNotice" style="margin-top:12px"></div>
    </div>
  </div>
</section>

<section id="planner" class="page">
  <div class="card">
    <h2>自動排程</h2>
    <div class="plan-start">
      <div class="plan-start-title">排程起點</div>
      <label class="plan-start-option" id="planStartDateOption">
        <input type="radio" name="planStartMode" id="planStartModeDate" value="date">
        從自選日開始
        <input type="date" id="planStartDate">
      </label>
      <label class="plan-start-option">
        <input type="radio" name="planStartMode" id="planStartModeMonday" value="monday">
        從週一開始
      </label>
      <div id="planStartInfo" class="small muted"></div>
    </div>
    <div class="actions" style="justify-content:flex-start;margin-top:0">
      <button class="btn primary" id="generate">
        生成讀書計畫
      </button>
    </div>
    <div id="capacityNotice" style="margin-top:14px"></div>
    <div id="planOutput" style="margin-top:16px"></div>
  </div>
</section>
</main>

<script>
/* =========================================================
   資料核心
========================================================= */
const KEY="study-planner-v02";
const BACKUP_VERSION=2;
const days=[
  "一","二","三","四","五","六","日"
];
const kinds={
  study:"讀書",
  meal:"吃飯",
  exercise:"運動",
  flex:"彈性",
  rest:"休息",
  other:"其他"
};
const kindClass={
  study:"study",
  meal:"meal",
  exercise:"exercise",
  flex:"flex",
  rest:"rest",
  other:"other"
};
let data={};
try{
  data=JSON.parse(
    localStorage.getItem(KEY)||"{}"
  );
}catch(e){
  data={};
}

/* =========================================================
   初始化資料
========================================================= */
if(!data.routine){
  data.routine=
    Array.from(
      {length:7},
      ()=>Array(40).fill("rest")
    );
}
data.routine=
  data.routine.map(dayArray=>{
    let arr=
      Array.isArray(dayArray)
        ? dayArray.slice(0,40)
        : [];
    while(arr.length<40){
      arr.push("rest");
    }
    return arr.map(k=>
      kinds[k]
        ? k
        : "rest"
    );
  });
while(data.routine.length<7){
  data.routine.push(
    Array(40).fill("rest")
  );
}
data.subjects=
  Array.isArray(data.subjects)
    ? data.subjects
    : [];
data.subjectWeights=
  Array.isArray(data.subjectWeights)
    ? data.subjectWeights
    : data.subjects.map(
        s=>({
          name:s.name,
          score:Number(s.score||0)
        })
      );
data.startDate=
  data.startDate||"";
data.examDate=
  data.examDate||"";
/* 排程起點：date＝自選日；monday＝從週一開始。
   舊資料沒有自選日時，沿用原本的起始日期。 */
data.planStartMode=
  data.planStartMode==="monday"
    ? "monday"
    : "date";
data.planStartDate=
  data.planStartDate||
  data.startDate||
  "";
if(
  !data.generatedPlan||
  typeof data.generatedPlan!=="object"
){
  data.generatedPlan=null;
}
let selectedKind="study";
let selectedCells=new Set();
let isDragging=false;
let dragMode="add";

/* =========================================================
   儲存
========================================================= */
function save(){
  try{
    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );
    showSaveStatus();
  }catch(e){
    console.error(e);
    const el=
      document.getElementById(
        "saveStatus"
      );
    if(el){
      el.textContent=
        "⚠ 無法保存資料";
    }
  }
}

function showSaveStatus(){
  const el=
    document.getElementById(
      "saveStatus"
    );
  if(!el)return;
  el.textContent=
    "✓ 已自動保存 · "+
    new Date().toLocaleTimeString(
      "zh-TW",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  el.classList.add("saved");
}

/* =========================================================
   日期工具
========================================================= */
function parseLocalDate(value){
  if(value instanceof Date){
    let d=new Date(value);
    d.setHours(0,0,0,0);
    return d;
  }
  if(!value)return null;
  const parts=
    String(value).split("-").map(Number);
  if(parts.length!==3)return null;
  const d=
    new Date(
      parts[0],
      parts[1]-1,
      parts[2]
    );
  d.setHours(0,0,0,0);
  return d;
}

function addDays(d,n){
  let x=
    new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(
    x.getDate()+n
  );
  return x;
}

function fmt(d){
  let x=
    new Date(d);
  x.setHours(0,0,0,0);
  return [
    x.getFullYear(),
    String(x.getMonth()+1).padStart(2,"0"),
    String(x.getDate()).padStart(2,"0")
  ].join("-");
}

const esc=s=>
  String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[c])
  );

/* =========================================================
   準備期間
========================================================= */
function dateDiffWeeks(){
  if(
    !data.startDate||
    !data.examDate
  ){
    return 0;
  }
  let s=
    parseLocalDate(data.startDate);
  let e=
    parseLocalDate(data.examDate);
  if(!s||!e)return 0;
  return Math.max(
    0,
    (e-s)/6048e5
  );
}

/* =========================================================
   剩餘週數
========================================================= */
function remainingWeeks(){
  if(!data.examDate){
    return 0;
  }
  let now=new Date();
  now.setHours(0,0,0,0);
  let ex=
    parseLocalDate(data.examDate);
  if(!ex)return 0;
  return Math.max(
    0,
    (ex-now)/6048e5
  );
}

/* =========================================================
   每週可讀書時間
========================================================= */
function cap(){
  return data.routine
    .flat()
    .filter(
      x=>x==="study"
    ).length*.5;
}

/* =========================================================
   每日讀書時間
========================================================= */
function dailyStudyHours(dayIndex){
  if(!data.routine[dayIndex])return 0;
  return data.routine[dayIndex]
    .filter(
      x=>x==="study"
    ).length*.5;
}

/* =========================================================
   更新每日總時數
========================================================= */
function updateDailyTotals(){
  for(
    let d=0;
    d<7;
    d++
  ){
    const el=
      document.getElementById(
        "dayTotal"+d
      );
    if(!el)continue;
    el.textContent=
      dailyStudyHours(d).toFixed(1)
      +" h";
  }
}

/* =========================================================
   準備期間理論總時數
========================================================= */
function totalPlanHours(){
  return cap()*
    dateDiffWeeks();
}

/* =========================================================
   倒數
========================================================= */
function countdown(){
  const a=
    document.getElementById(
      "daysLeft"
    );
  const b=
    document.getElementById(
      "weeksLeft"
    );
  if(!data.examDate){
    a.textContent="—";
    b.textContent="—";
    document.getElementById(
      "dateInfo"
    ).textContent=
      "尚未設定考試日期";
    return;
  }
  let now=new Date();
  now.setHours(0,0,0,0);
  let ex=
    parseLocalDate(data.examDate);
  let d=Math.max(
    0,
    Math.ceil(
      (ex-now)/864e5
    )
  );
  a.textContent=d;
  b.textContent=
    (d/7).toFixed(1);
  document.getElementById(
    "dateInfo"
  ).textContent=
    data.startDate
      ? `準備期間：${data.startDate} ～ ${data.examDate}`
      : `考試日期：${data.examDate}`;
}

/* =========================================================
   每週作息
========================================================= */
function cellKey(day,index){
  return day+"-"+index;
}

function updateSelectionVisual(){
  document
    .querySelectorAll(".slot")
    .forEach(
      b=>{
        if(
          selectedCells.has(
            b.dataset.key
          )
        ){
          b.classList.add(
            "selected"
          );
        }else{
          b.classList.remove(
            "selected"
          );
        }
      }
    );
  document.getElementById(
    "selectedCount"
  ).textContent=
    selectedCells.size;
}

function toggleCell(key){
  if(
    selectedCells.has(key)
  ){
    selectedCells.delete(key);
  }else{
    selectedCells.add(key);
  }
}

function dragSelect(key){
  if(dragMode==="add"){
    selectedCells.add(key);
  }else{
    selectedCells.delete(key);
  }
  updateSelectionVisual();
}

function applyKindToSelection(){
  if(!selectedCells.size)return;
  selectedCells.forEach(
    key=>{
      let parts=
        key.split("-");
      let d=
        Number(parts[0]);
      let i=
        Number(parts[1]);
      if(
        data.routine[d] &&
        typeof data.routine[d][i]!=="undefined"
      ){
        data.routine[d][i]=
          selectedKind;
      }
    }
  );
  save();
  selectedCells.clear();
  renderRoutine();
  update();
}

/* =========================================================
   Render 作息
========================================================= */
function renderRoutine(){
  let body=
    document.getElementById(
      "routineBody"
    );
  body.innerHTML="";
  for(
    let i=0;
    i<40;
    i++
  ){
    let mins=
      360+i*30;
    let h=
      Math.floor(mins/60)%24;
    let m=
      mins%60;
    let label=
      String(h).padStart(2,"0")
      +":"
      +
      String(m).padStart(2,"0");
    let tr=
      document.createElement("tr");
    tr.innerHTML=
      `<td>${label}</td>`;
    for(
      let d=0;
      d<7;
      d++
    ){
      let td=
        document.createElement("td");
      let b=
        document.createElement(
          "button"
        );
      let k=
        data.routine[d][i];
      b.className=
        "slot "+
        (
          kindClass[k]||"rest"
        );
      b.textContent=
        kinds[k]||"休息";
      b.dataset.key=
        cellKey(d,i);
      b.addEventListener(
        "pointerdown",
        e=>{
          e.preventDefault();
          isDragging=true;
          const key=
            b.dataset.key;
          if(
            selectedCells.has(key)
          ){
            dragMode="remove";
            selectedCells.delete(key);
          }else{
            dragMode="add";
            selectedCells.add(key);
          }
          updateSelectionVisual();
        }
      );
      b.addEventListener(
        "pointerenter",
        e=>{
          if(!isDragging)return;
          dragSelect(
            b.dataset.key
          );
        }
      );
      b.addEventListener(
        "click",
        e=>{
          e.preventDefault();
        }
      );
      td.appendChild(b);
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  document.getElementById(
    "routineTotal"
  ).textContent=
    cap().toFixed(1)
    +" 小時";
  updateDailyTotals();
  updateSelectionVisual();
}

document.addEventListener(
  "pointerup",
  ()=>{
    isDragging=false;
  }
);

/* =========================================================
   配分總表
========================================================= */
function renderWeights(){
  let body=
    document.getElementById(
      "weightBody"
    );
  let totalScore=
    data.subjectWeights.reduce(
      (a,s)=>
        a+Number(s.score||0),
      0
    );
  let totalHours=
    totalPlanHours();
  let weeklyCapacity=
    cap();
  body.innerHTML="";
  if(
    !data.subjectWeights.length
  ){
    body.innerHTML=
      '<tr>'+
      '<td colspan="6" class="empty">'+
      '尚未加入科目'+
      '</td>'+
      '</tr>';
    document.getElementById(
      "weightSummary"
    ).textContent=
      `目前準備期間可配置約 ${totalHours.toFixed(1)} 小時；每週可讀書 ${weeklyCapacity.toFixed(1)} 小時。`;
    return;
  }
  data.subjectWeights.forEach(
    (s,i)=>{
      let ratio=
        totalScore
          ? Number(s.score)/totalScore
          : 0;
      let totalSubjectHours=
        totalHours*ratio;
      let weeklyHours=
        weeklyCapacity*ratio;
      let tr=
        document.createElement("tr");
      tr.innerHTML=
        `<td>
          <b>${esc(s.name)}</b>
        </td>
        <td>
          ${Number(s.score||0)}
        </td>
        <td class="ratio">
          ${(ratio*100).toFixed(1)}%
        </td>
        <td class="hours">
          ${totalSubjectHours.toFixed(1)} h
        </td>
        <td class="week-hours">
          ${weeklyHours.toFixed(1)} h
        </td>
        <td>
          <button
            class="delete"
            data-i="${i}"
            title="刪除">
            ×
          </button>
        </td>`;
      body.appendChild(tr);
    }
  );
  let tr=
    document.createElement("tr");
  tr.className=
    "sum-row";
  tr.innerHTML=
    `<td>合計</td>
     <td>${totalScore}</td>
     <td>100%</td>
     <td>${totalHours.toFixed(1)} h</td>
     <td>${weeklyCapacity.toFixed(1)} h</td>
     <td></td>`;
  body.appendChild(tr);
  body
    .querySelectorAll(".delete")
    .forEach(
      b=>{
        b.onclick=()=>{
          data.subjectWeights.splice(
            +b.dataset.i,
            1
          );
          save();
          renderWeights();
          update();
        };
      }
    );
  document.getElementById(
    "weightSummary"
  ).textContent=
    `準備期間約 ${dateDiffWeeks().toFixed(1)} 週 × 每週 ${cap().toFixed(1)} 小時 ＝ ${totalHours.toFixed(1)} 小時；上表依考試配分比例換算。`;
}

/* =========================================================
   現階段科目配置
========================================================= */
function renderSubjects(){
  let body=
    document.getElementById(
      "subjectBody"
    );
  body.innerHTML="";
  if(!data.subjects.length){
    body.innerHTML=
      '<tr>'+
      '<td colspan="6" class="empty">'+
      '尚未加入科目'+
      '</td>'+
      '</tr>';
    const notice=
      document.getElementById(
        "subjectCapacityNotice"
      );
    if(notice){
      notice.innerHTML="";
    }
    return;
  }
  let weeks=
    remainingWeeks();
  data.subjects.forEach(
    (s,i)=>{
      let hours=
        Number(s.hours||0);
      let session=
        Number(s.session||0);
      let n=
        session>0
          ? hours/session
          : 0;
      let tr=
        document.createElement("tr");
      tr.innerHTML=
        `<td>
          <b>${esc(s.name)}</b>
          <div class="small muted">
            ${esc(s.type)}
          </div>
        </td>
        <td>
          ${hours} h
        </td>
        <td>
          ${session} h
        </td>
        <td>
          ${n.toFixed(1)}
        </td>
        <td>
          ${(hours*weeks).toFixed(1)} h
        </td>
        <td>
          <button
            class="delete"
            data-i="${i}">
            ×
          </button>
        </td>`;
      body.appendChild(tr);
    }
  );
  body
    .querySelectorAll(".delete")
    .forEach(
      b=>{
        b.onclick=()=>{
          data.subjects.splice(
            +b.dataset.i,
            1
          );
          data.generatedPlan=null;
          save();
          renderSubjects();
          update();
          clearPlanDisplay();
        };
      }
    );
  let need=
    data.subjects.reduce(
      (a,s)=>
        a+Number(s.hours||0),
      0
    );
  let capacity=
    cap();
  const notice=
    document.getElementById(
      "subjectCapacityNotice"
    );
  if(
    notice &&
    need>capacity
  ){
    notice.innerHTML=
      `<div class="notice danger">
        ⚠ 目前科目每週需求共
        <b>${need.toFixed(1)} 小時</b>，
        已超過每週可讀書時間
        <b>${capacity.toFixed(1)} 小時</b>，
        超出
        <b>${(need-capacity).toFixed(1)} 小時</b>。
      </div>`;
  }else if(notice){
    notice.innerHTML="";
  }
}

/* =========================================================
   總覽更新
========================================================= */
function update(){
  let c=
    cap();
  let need=
    data.subjects.reduce(
      (a,s)=>
        a+Number(s.hours||0),
      0
    );
  document.getElementById(
    "weeklyStudy"
  ).textContent=
    c.toFixed(1);
  document.getElementById(
    "summary"
  ).innerHTML=
    `<p>
      每週可讀書：
      <b>${c.toFixed(1)} 小時</b>
    </p>
    <p>
      目前科目需求：
      <b>${need.toFixed(1)} 小時／週</b>
    </p>
    <p>
      準備期間可配置：
      <b>${totalPlanHours().toFixed(1)} 小時</b>
    </p>
    ${
      need>c
        ? '<div class="notice danger">'+
          '科目需求超過每週可讀書時間。'+
          '</div>'
        : '<div class="notice">'+
          '目前容量足以容納科目需求。'+
          '</div>'
    }`;
  countdown();
  renderWeights();
}

/* =========================================================
   分頁切換
========================================================= */
document
  .querySelectorAll("nav button")
  .forEach(
    b=>{
      b.onclick=()=>{
        document
          .querySelectorAll(
            "nav button"
          )
          .forEach(
            x=>
              x.classList.remove(
                "active"
              )
          );
        b.classList.add(
          "active"
        );
        document
          .querySelectorAll(
            ".page"
          )
          .forEach(
            x=>
              x.classList.remove(
                "active"
              )
          );
        document
          .getElementById(
            b.dataset.page
          )
          .classList.add(
            "active"
          );
        if(
          b.dataset.page==="planner"
        ){
          renderSavedPlan();
        }
      };
    }
  );

/* =========================================================
   作息類型
========================================================= */
document
  .querySelectorAll(
    "#palette button"
  )
  .forEach(
    b=>{
      b.onclick=()=>{
        document
          .querySelectorAll(
            "#palette button"
          )
          .forEach(
            x=>
              x.classList.remove(
                "selected"
              )
          );
        b.classList.add(
          "selected"
        );
        selectedKind=
          b.dataset.kind;
        applyKindToSelection();
      };
    }
  );

/* =========================================================
   清除選取
========================================================= */
document.getElementById(
  "clearSelection"
).onclick=()=>{
  selectedCells.clear();
  updateSelectionVisual();
};

/* =========================================================
   儲存日期
========================================================= */
function saveDates(){
  const start=
    document.getElementById(
      "startDate"
    ).value;
  const exam=
    document.getElementById(
      "examDate"
    ).value;
  if(
    start&&
    exam&&
    parseLocalDate(exam)<
    parseLocalDate(start)
  ){
    alert(
      "考試日期不能早於起始日期。"
    );
    return false;
  }
  data.startDate=start;
  data.examDate=exam;
  data.generatedPlan=null;
  save();
  renderSubjects();
  update();
  refreshPlanStartUI();
  clearPlanDisplay();
  return true;
}

document.getElementById(
  "startDate"
).addEventListener(
  "change",
  saveDates
);
document.getElementById(
  "examDate"
).addEventListener(
  "change",
  saveDates
);
document.getElementById(
  "saveDates"
).onclick=
  saveDates;

/* =========================================================
   清除作息
========================================================= */
document.getElementById(
  "clearRoutine"
).onclick=()=>{
  if(
    confirm(
      "確定清除全部作息？"
    )
  ){
    data.routine=
      Array.from(
        {length:7},
        ()=>Array(40).fill("rest")
      );
    data.generatedPlan=null;
    selectedCells.clear();
    save();
    renderRoutine();
    update();
    clearPlanDisplay();
  }
};

/* =========================================================
   儲存作息
========================================================= */
document.getElementById(
  "saveRoutine"
).onclick=()=>{
  save();
  alert(
    "作息已保存。"
  );
};

/* =========================================================
   新增考試配分科目
========================================================= */
document.getElementById(
  "addWeight"
).onclick=()=>{
  let name=
    document.getElementById(
      "wName"
    ).value.trim();
  let score=
    Number(
      document.getElementById(
        "wScore"
      ).value||0
    );
  if(
    !name||
    score<=0
  ){
    alert(
      "請填寫科目名稱與配分。"
    );
    return;
  }
  data.subjectWeights.push({
    name,
    score
  });
  save();
  document.getElementById(

/* =========================================================
   自動排程
========================================================= */
function getRoutineDayIndex(date){
  return(
    date.getDay()+6
  )%7;
}

function ensurePlanOccupied(
  occupied,
  date
){
  const key=
    fmt(date);
  if(!occupied[key]){
    occupied[key]=
      Array(40).fill(false);
  }
  return occupied[key];
}

/* =========================================================
   取得某一天所有連續可用讀書區段
========================================================= */
function getAvailableBlocks(
  date,
  occupied
){
  const dow=
    getRoutineDayIndex(date);
  const routineDay=
    data.routine[dow];
  if(!routineDay)return[];
  const occupiedDay=
    ensurePlanOccupied(
      occupied,
      date
    );
  const blocks=[];
  let i=0;
  while(i<40){
    if(
      routineDay[i]!=="study"||
      occupiedDay[i]
    ){
      i++;
      continue;
    }
    const startSlot=i;
    while(
      i<40&&
      routineDay[i]==="study"&&
      !occupiedDay[i]
    ){
      i++;
    }
    const endSlot=i;
    blocks.push({
      date:new Date(date),
      key:fmt(date),
      startSlot,
      endSlot,
      slots:endSlot-startSlot
    });
  }
  return blocks;
}

/* =========================================================
   找出所有可以放入指定時數的位置
========================================================= */
function getPositions(
  date,
  needSlots,
  occupied
){
  const blocks=
    getAvailableBlocks(
      date,
      occupied
    );
  const positions=[];
  blocks.forEach(
    block=>{
      if(
        block.slots<needSlots
      ){
        return;
      }
      for(
        let startSlot=
          block.startSlot;
        startSlot+
          needSlots<=
          block.endSlot;
        startSlot++
      ){
        positions.push({
          date:new Date(date),
          key:block.key,
          startSlot,
          needSlots,
          blockSlots:block.slots,
          remainingAfter:
            block.slots-
            needSlots,
          blockStart:
            block.startSlot
        });
      }
    }
  );
  return positions;
}

/* =========================================================
   找最佳完整 session 位置
========================================================= */
function findBestFullPosition(
  date,
  needSlots,
  occupied
){
  const positions=
    getPositions(
      date,
      needSlots,
      occupied
    );
  if(!positions.length){
    return null;
  }
  positions.sort(
    (a,b)=>{
      if(
        a.remainingAfter!==
        b.remainingAfter
      ){
        return(
          a.remainingAfter-
          b.remainingAfter
        );
      }
      return(
        a.startSlot-
        b.startSlot
      );
    }
  );
  return positions[0];
}

/* =========================================================
   ★ 新的拆分邏輯
   最低單位 = 1 小時 = 2 slots
   不再產生 0.5 小時。
========================================================= */

/*
  取得所有「至少 1 小時」的可用區塊。
  注意：
  這裡刻意排除只有 1 slot = 0.5h 的區塊。
*/
function getChunkBlocks(
  weekDates,
  occupied
){
  const result=[];
  weekDates.forEach(
    date=>{
      const key=
        fmt(date);
      const blocks=
        getAvailableBlocks(
          date,
          occupied
        );
      blocks.forEach(
        block=>{
          if(block.slots<2){
            return;
          }
          result.push({
            date:new Date(date),
            key,
            startSlot:block.startSlot,
            blockSlots:block.slots,
            alreadyUsed:false
          });
        }
      );
    }
  );
  return result;
}

/*
  找出一組「不低於 1 小時」的拆分方式。
  核心原則：
  1. 不允許 1 slot（0.5h）。
  2. 優先尋找可以「剛好完成」remainingSlots 的組合。
  3. 若有多種剛好完成的組合，
     優先較少的事件數。
  4. 若事件數相同，
     優先較大的連續區塊。
  5. 如果無法剛好完成，
     找出「不超過剩餘時數」的最大可安排量。
  6. 絕不為了填滿而使用 0.5h。
*/
function findBestSplitPlan(
  weekDates,
  remainingSlots,
  occupied,
  usedDays
){
  if(remainingSlots<2){
    return [];
  }

  const blocks=
    getChunkBlocks(
      weekDates,
      occupied
    );

  if(!blocks.length){
    return [];
  }

  /*
    每個區塊最多只取到 remainingSlots。
    每個候選 chunk 都至少 2 slots。
  */
  /*
    同一個連續區塊會產生多種長度的候選，
    例如 2、3、4 個 slot，但它們都從同一個起點開始。
    因此候選要「依區塊分組」，每個區塊最多只能挑一個，
    否則同一科目會在同一時段被排兩次（色塊重疊）。
  */
  const candidateGroups=[];

  blocks.forEach(
    block=>{
      const maxChunk=
        Math.min(
          block.blockSlots,
          remainingSlots
        );

      const group=[];

      for(
        let slots=2;
        slots<=maxChunk;
        slots++
      ){
        group.push({
          date:new Date(block.date),
          key:block.key,
          startSlot:block.startSlot,
          blockSlots:block.blockSlots,
          slots,
          alreadyUsed:
            usedDays.has(block.key)
        });
      }

      if(group.length){
        candidateGroups.push(group);
      }
    }
  );

  if(!candidateGroups.length){
    return [];
  }

  /*
    動態規劃：
    dp[sum] = 到目前為止可以形成的最佳組合。
    每個候選區塊只能被使用一次。
    同一天可以有多個區塊，但不會重複使用同一個
    實際 block。
  */
  const dp=
    Array.from(
      {length:remainingSlots+1},
      ()=>null
    );

  dp[0]=[];

  candidateGroups.forEach(
    group=>{
      /*
        只從「處理這個區塊之前」的結果往上加，
        保證同一個區塊最多被選一次。
      */
      const previous=dp.slice();

      group.forEach(
        candidate=>{
          for(
            let sum=
              remainingSlots-
              candidate.slots;
            sum>=0;
            sum--
          ){
            if(!previous[sum])continue;

            const newSum=
              sum+candidate.slots;

            if(newSum>remainingSlots){
              continue;
            }

            const newPlan=
              previous[sum].concat(candidate);

            const existing=
              dp[newSum];

            if(
              !existing||
              isBetterSplitPlan(
                newPlan,
                existing
              )
            ){
              dp[newSum]=newPlan;
            }
          }
        }
      );
    }
  );

  /*
    優先剛好完成。
  */
  if(dp[remainingSlots]){
    return optimizeSplitPlan(
      dp[remainingSlots]
    );
  }

  /*
    如果無法剛好完成，
    找「最大可以安排的整數小時量」。
    例如 remaining = 3h，
    只有 1.5h + 1.5h 可以剛好完成，
    就使用 3h。
    若只有 2h + 0.5h，
    只使用 2h，
    0.5h 留下，不排。
  */
  for(
    let sum=
      remainingSlots-1;
    sum>=2;
    sum--
  ){
    if(dp[sum]){
      return optimizeSplitPlan(
        dp[sum]
      );
    }
  }

  return [];
}

/*
  比較兩個拆分方案。
  score 越好越優先。
*/
function isBetterSplitPlan(
  candidate,
  existing
){
  if(!existing)return true;

  /*
    第一優先：
    事件數越少越好。
  */
  if(
    candidate.length!==
    existing.length
  ){
    return(
      candidate.length<
      existing.length
    );
  }

  /*
    第二優先：
    排序後比較最大的 chunk。
    優先較大的連續時段。
  */
  const a=
    candidate
      .map(x=>x.slots)
      .sort((x,y)=>y-x);
  const b=
    existing
      .map(x=>x.slots)
      .sort((x,y)=>y-x);

  for(
    let i=0;
    i<a.length;
    i++
  ){
    if(a[i]!==b[i]){
      return a[i]>b[i];
    }
  }

  /*
    第三優先：
    未使用過的日期優先。
    讓同一科目盡量分散到不同日期。
  */
  const aUsed=
    candidate.filter(
      x=>x.alreadyUsed
    ).length;
  const bUsed=
    existing.filter(
      x=>x.alreadyUsed
    ).length;

  if(aUsed!==bUsed){
    return aUsed<bUsed;
  }

  return false;
}

/*
  將拆分方案排序：
  先使用較完整的大區塊，
  同時優先沒有使用過的日期，
  最後才按照日期／時間排列。
*/
function optimizeSplitPlan(
  plan
){
  return plan
    .slice()
    .sort(
      (a,b)=>{
        if(
          a.alreadyUsed!==
          b.alreadyUsed
        ){
          return(
            a.alreadyUsed
              ? 1
              : -1
          );
        }
        if(a.slots!==b.slots){
          return b.slots-a.slots;
        }
        if(a.date-b.date!==0){
          return a.date-b.date;
        }
        return a.startSlot-b.startSlot;
      }
    );
}

/* =========================================================
   舊函式保留：
   供其他程式邏輯使用。
   但新的自動排程不再使用 0.5h chunk。
========================================================= */
function findBestChunkPosition(
  date,
  maxSlots,
  occupied
){
  const blocks=
    getAvailableBlocks(
      date,
      occupied
    );
  if(!blocks.length){
    return null;
  }

  const validBlocks=
    blocks.filter(
      block=>
        block.slots>=2
    );

  if(!validBlocks.length){
    return null;
  }

  const positions=[];

  validBlocks.forEach(
    block=>{
      const chunkSlots=
        Math.min(
          maxSlots,
          block.slots
        );

      /*
        ★ 最低 1 小時。
      */
      if(chunkSlots<2)return;

      const startSlot=
        block.startSlot;

      positions.push({
        date:new Date(date),
        key:block.key,
        startSlot,
        needSlots:chunkSlots,
        blockSlots:block.slots,
        remainingAfter:
          block.slots-
          chunkSlots
      });
    }
  );

  positions.sort(
    (a,b)=>{
      if(
        a.needSlots!==
        b.needSlots
      ){
        return(
          b.needSlots-
          a.needSlots
        );
      }
      if(
        a.remainingAfter!==
        b.remainingAfter
      ){
        return(
          a.remainingAfter-
          b.remainingAfter
        );
      }
      if(
        a.date-b.date!==0
      ){
        return(
          a.date-b.date
        );
      }
      return(
        a.startSlot-
        b.startSlot
      );
    }
  );

  return positions[0]||null;
}

/* =========================================================
   取得某天剩餘讀書容量
========================================================= */
function getRemainingDaySlots(
  date,
  occupied
){
  return getAvailableBlocks(
    date,
    occupied
  ).reduce(
    (sum,block)=>
      sum+block.slots,
    0
  );
}

/* =========================================================
   佔用格子
========================================================= */
function occupyPlanSlots(
  date,
  startSlot,
  slots,
  occupied
){
  const arr=
    ensurePlanOccupied(
      occupied,
      date
    );
  for(
    let i=0;
    i<slots;
    i++
  ){
    arr[startSlot+i]=true;
  }
}

/* =========================================================
   新增排程事件
========================================================= */
function addPlanEvent(
  events,
  date,
  startSlot,
  slots,
  subject,
  subjectIndex,
  occupied
){
  occupyPlanSlots(
    date,
    startSlot,
    slots,
    occupied
  );
  const key=
    fmt(date);
  const startMinutes=
    360+
    startSlot*30;
  const endMinutes=
    startMinutes+
    slots*30;
  if(!events[key]){
    events[key]=[];
  }
  const actualHours=
    slots*.5;
  events[key].push({
    time:
      formatTime(
        startMinutes
      ),
    startTime:
      formatTime(
        startMinutes
      ),
    endTime:
      formatTime(
        endMinutes
      ),
    startMinutes,
    endMinutes,
    name:
      subject.name,
    type:
      subject.type,
    hours:
      actualHours,
    subjectIndex
  });
}

/* =========================================================
   排程起點
   自選日只決定「這次排程的第一天」，
   每一天的作息仍由 getRoutineDayIndex(date)
   依真正的星期幾決定。
========================================================= */
function getPlanStart(){
  if(data.planStartMode==="monday"){
    let base=
      parseLocalDate(
        data.startDate
      );
    if(!base){
      base=new Date();
      base.setHours(0,0,0,0);
    }
    const dow=
      getRoutineDayIndex(base);
    return dow===0
      ? base
      : addDays(base,7-dow);
  }
  return parseLocalDate(
    data.planStartDate
  );
}

function refreshPlanStartUI(){
  const dateRadio=
    document.getElementById(

    );
  const mondayRadio=
    document.getElementById(

    document.getElementById(
      "planStartDate"
    );

  const isDate=

  dateRadio.checked=isDate;

  ).classList.toggle(

  );

      : "請先選擇起始日";
}

/* =========================================================
   取得排程期間
========================================================= */
function getPlanningDates(){
  let start=
    getPlanStart();
  let exam=
    parseLocalDate(
      data.examDate
    );
  if(!start||!exam){
    return null;
  }
  /* 固定產生 7 天的課表（一週），
     每一天依真正的星期幾套用每週作息。 */
  let requestedDays=7;
  let requestedEnd=
    addDays(
      start,
      requestedDays
    );
  let end=
    requestedEnd<exam
      ? requestedEnd
      : exam;
  if(end<=start){
    return {
      start,
      end,
      dates:[]
    };
  }
  const dates=[];
  for(
    let d=new Date(start);
    d<end;
    d=addDays(d,1)
  ){
    dates.push(
      new Date(d)
    );
  }
  return {
    start,
    end,
    dates
  };
}

/* =========================================================
   ★ 自動排程主程式
========================================================= */
function generate(){
  if(!getPlanStart()){
    alert(
      "請先選擇排程起始日。"
    );
    return;
  }
  if(!data.examDate){
    alert(
      "請先設定考試日期。"
    );
    return;
  }
  let planning=
    getPlanningDates();
  if(!planning){
    alert(
      "日期設定格式錯誤，請重新設定。"
    );
    return;
  }
  let start=
    planning.start;
  let end=
    planning.end;
  let dates=
    planning.dates;
  if(!dates.length){
    document.getElementById(
      "capacityNotice"
    ).innerHTML=
      `<div class="notice danger">
        排程起點與考試日期之間沒有可排程的日期。
      </div>`;
    document.getElementById(
      "planOutput"
    ).innerHTML="";
    data.generatedPlan=null;
    save();
    return;
  }

  const weeklyCapacity=
    cap();
  const weeklyNeed=
    data.subjects.reduce(
      (a,s)=>
        a+Number(s.hours||0),
      0
    );
  let capacityHTML=
    weeklyNeed>weeklyCapacity
      ? `<div class="notice danger">
          ⚠ 每週科目需求
          <b>${weeklyNeed.toFixed(1)} 小時</b>，
          可用
          <b>${weeklyCapacity.toFixed(1)} 小時</b>，
          超出
          <b>${(weeklyNeed-weeklyCapacity).toFixed(1)} 小時</b>。
        </div>`
      : `<div class="notice">
          ✓ 每週科目需求
          <b>${weeklyNeed.toFixed(1)} 小時</b>／
          可用
          <b>${weeklyCapacity.toFixed(1)} 小時</b>。
        </div>`;

  document.getElementById(
    "capacityNotice"
  ).innerHTML=
    capacityHTML;

  if(
    !data.subjects.length||
    !weeklyCapacity
  ){
    document.getElementById(
      "planOutput"
    ).innerHTML=
      '<div class="empty">'+
      '請先設定作息與科目。'+
      '</div>';
    data.generatedPlan=null;
    save();
    return;
  }

  const events={};
  const occupied={};
  const shortfall={};
  const scheduledHours={};

  const planningWeeks=[];
  for(
    let weekStart=
      new Date(start);
    weekStart<end;
    weekStart=
      addDays(
        weekStart,
        7
      )
  ){
    let weekEnd=
      addDays(
        weekStart,
        7
      );
    let actualEnd=
      weekEnd<end
        ? weekEnd
        : end;
    const weekDates=[];
    for(
      let d=
        new Date(weekStart);
      d<actualEnd;
      d=
        addDays(
          d,
          1
        )
    ){
      weekDates.push(
        new Date(d)
      );
    }
    if(weekDates.length){
      planningWeeks.push(
        weekDates
      );
    }
  }

  planningWeeks.forEach(
    (weekDates,weekIndex)=>{
      const subjects=
        data.subjects
          .map(
            (s,subjectIndex)=>{
              const weeklyHours=
                Number(
                  s.hours||0
                );
              const sessionHours=
                Number(
                  s.session||0
                );
              if(
                !Number.isFinite(
                  weeklyHours
                )||
                !Number.isFinite(
                  sessionHours
                )||
                weeklyHours<=0||
                sessionHours<=0
              ){
                return null;
              }
              return {
                subject:s,
                subjectIndex,
                weeklyHours,
                sessionHours,
                totalSlots:
                  Math.round(
                    weeklyHours*2
                  ),
                sessionSlots:
                  Math.round(
                    sessionHours*2
                  )
              };
            }
          )
          .filter(
            x=>
              x&&
              x.totalSlots>0
          );

      subjects.sort(
        (a,b)=>{
          if(
            b.sessionSlots!==
            a.sessionSlots
          ){
            return(
              b.sessionSlots-
              a.sessionSlots
            );
          }
          return(
            b.weeklyHours-
            a.weeklyHours
          );
        }
      );

      subjects.forEach(
        item=>{
          const subject=
            item.subject;
          const subjectIndex=
            item.subjectIndex;
          const targetSlots=
            item.totalSlots;
          const fullSessionSlots=
            Math.max(
              1,
              item.sessionSlots
            );
          let remainingSlots=
            targetSlots;
          let placedSlots=0;
          let fullSessionsPlaced=0;
          const usedDays=
            new Set();

          /* =================================================
             第一階段：
             優先安排完整 session。
          ================================================= */
          while(
            remainingSlots>=
            fullSessionSlots
          ){
            const candidates=[];
            weekDates.forEach(
              date=>{
                const key=
                  fmt(date);
                if(
                  usedDays.has(key)
                ){
                  return;
                }
                const position=
                  findBestFullPosition(
                    date,
                    fullSessionSlots,
                    occupied
                  );
                if(!position){
                  return;
                }
                const remainingCapacity=
                  getRemainingDaySlots(
                    date,
                    occupied
                  );
                candidates.push({
                  date,
                  key,
                  position,
                  remainingCapacity
                });
              }
            );

            if(!candidates.length){
              break;
            }

            candidates.sort(
              (a,b)=>{
                if(
                  a.position.remainingAfter!==
                  b.position.remainingAfter
                ){
                  return(
                    a.position.remainingAfter-
                    b.position.remainingAfter
                  );
                }
                if(
                  a.remainingCapacity!==
                  b.remainingCapacity
                ){
                  return(
                    a.remainingCapacity-
                    b.remainingCapacity
                  );
                }
                return(
                  a.date-b.date
                );
              }
            );

            const chosen=
              candidates[0];

            addPlanEvent(
              events,
              chosen.date,
              chosen.position.startSlot,
              fullSessionSlots,
              subject,
              subjectIndex,
              occupied
            );

            usedDays.add(
              chosen.key
            );
            remainingSlots-=
              fullSessionSlots;
            placedSlots+=
              fullSessionSlots;
            fullSessionsPlaced++;
          }

          /* =================================================
             第二階段：
             完整 session 放不下時，
             尋找 ≥1 小時的最佳拆分組合。
             ★ 這裡是本次主要修改。
          ================================================= */
          while(
            remainingSlots>=2
          ){
            const splitPlan=
              findBestSplitPlan(
                weekDates,
                remainingSlots,
                occupied,
                usedDays
              );

            if(!splitPlan.length){
              break;
            }

            /*
              splitPlan 已經按照：
              ① 未使用日期
              ② 較大區塊
              ③ 日期
              ④ 時間
              排好。
            */

            let addedThisRound=0;

            for(
              const chunk of splitPlan
            ){
              if(
                remainingSlots<2
              ){
                break;
              }

              const actualSlots=
                Math.min(
                  chunk.slots,
                  remainingSlots,
                  chunk.blockSlots
                );

              /*
                ★ 最低單位 = 1 小時。
                如果只能剩 0.5h，
                不排。
              */
              if(actualSlots<2){
                continue;
              }

              addPlanEvent(
                events,
                chunk.date,
                chunk.startSlot,
                actualSlots,
                subject,
                subjectIndex,
                occupied
              );

              usedDays.add(
                chunk.key
              );

              remainingSlots-=
                actualSlots;
              placedSlots+=
                actualSlots;
              addedThisRound+=
                actualSlots;
            }

            if(
              addedThisRound<=0
            ){
              break;
            }
          }

          /* =================================================
             第三階段：
             如果只剩 0.5h，
             直接留白。
             不再硬塞。
          ================================================= */
          if(
            remainingSlots>0
          ){
            shortfall[subjectIndex]=
              (
                shortfall[subjectIndex]||
                0
              )+
              remainingSlots*.5;
          }

          scheduledHours[subjectIndex]=
            (
              scheduledHours[subjectIndex]||
              0
            )+
            placedSlots*.5;
        }
      );
    }
  );

  Object.keys(events).forEach(
    key=>{
      events[key].sort(
        (a,b)=>
          a.startMinutes-
          b.startMinutes
      );
    }
  );

  data.generatedPlan={
    start:
      fmt(start),
    end:
      fmt(end),
    range:"week",
    generatedAt:
      new Date().toISOString(),
    events,
    shortfall,
    scheduledHours
  };

  save();

  let resultHTML="";

  const shortfallIndexes=
    Object.keys(
      shortfall
    );

  if(
    shortfallIndexes.length
  ){
    const detail=
      shortfallIndexes
        .map(
          subjectIndex=>{
            const subject=
              data.subjects[
                subjectIndex
              ];
            const hours=
              shortfall[
                subjectIndex
              ];
            return(
              `${esc(subject.name)} `+
              `${hours.toFixed(1)} 小時`
            );
          }
        )
        .join("、");

    resultHTML=
      `<div class="notice danger" style="margin-top:8px">
        ⚠ 尚未排入：
        <b>${detail}</b>
      </div>`;
  }else{
    resultHTML=
      `<div class="notice" style="margin-top:8px">
        ✓ 本次排程已成功安排各科的每週需求。
      </div>`;
  }

  document.getElementById(
    "capacityNotice"
  ).innerHTML+=
    resultHTML;

  renderPlan(
    events,
    start,
    end
  );
}

/* =========================================================
   時間格式
========================================================= */
function formatTime(mins){
  let normalized=
    Number(mins)%(24*60);
  if(normalized<0){
    normalized+=24*60;
  }
  if(!Number.isFinite(normalized)){
    return "00:00";
  }
  let h=
    Math.floor(
      normalized/60
    );
  let m=
    normalized%60;
  return(
    String(h).padStart(2,"0")
    +":"
    +
    String(m).padStart(2,"0")
  );
}

/* =========================================================
   時間軸專用格式
   06:00～隔日02:00
   每一 slot = 30 分鐘
========================================================= */
function formatTimelineTime(slot){
  const numericSlot=
    Number(slot);
  const totalMinutes=
    360+
    numericSlot*30;
  const normalized=
    totalMinutes%(24*60);
  const hour=
    Math.floor(normalized/60);
  const minute=
    normalized%60;
  return(
    String(hour).padStart(2,"0")
    +":"
    +
    String(minute).padStart(2,"0")
  );
}

/* =========================================================
   取得某日期所在週的星期一
========================================================= */
function getMonday(date){
  let d=
    new Date(date);
  d.setHours(
    0,0,0,0
  );
  let day=
    d.getDay();
  let diff=
    day===0
      ? -6
      : 1-day;
  return addDays(
    d,
    diff
  );
}

/* =========================================================
   ★ 顯示用：合併相鄰的同一科目事件
   排程本身仍然保留原始 event。
   只有在畫面顯示時：
   14:00～15:00
   15:00～16:00
   16:00～16:30
   如果都是同一科目、同一類型，而且前後相接，
   就合併成：
   14:00～16:30
   2.5h
========================================================= */
function mergeAdjacentPlanEvents(events){
  const merged={};
  Object.keys(events||{}).forEach(
    key=>{
      const list=
        (events[key]||[])
          .map(e=>({...e}))
          .sort(
            (a,b)=>
              Number(a.startMinutes)-
              Number(b.startMinutes)
          );
      const result=[];
      list.forEach(
        e=>{
          const last=
            result[result.length-1];
          if(
            last &&
            last.subjectIndex===
              e.subjectIndex &&
            last.name===e.name &&
            last.type===e.type &&
            Number(last.endMinutes)===
              Number(e.startMinutes)
          ){
            last.endMinutes=
              Number(e.endMinutes);
            last.endTime=
              e.endTime;
            last.hours=
              Number(last.hours||0)+
              Number(e.hours||0);
          }else{
            result.push(e);
          }
        }
      );
      merged[key]=result;
    }
  );
  return merged;
}

/* =========================================================
   顯示自動排程
   ★ 保留你剛完成的色塊合併功能。
========================================================= */
function renderPlan(
  events,
  start,
  end
){
  const displayEvents=
    mergeAdjacentPlanEvents(events);

  let firstMonday=
    getMonday(start);
  let lastDisplaySunday=
    addDays(
      getMonday(
        addDays(
          end,
          -1
        )
      ),
      6
    );
  let html=
    '<div class="plan-wrapper">';
  html+=
    '<div class="plan-calendar">';

  for(
    let weekMonday=
      new Date(firstMonday);
    weekMonday<=lastDisplaySunday;
    weekMonday=
      addDays(
        weekMonday,
        7
      )
  ){
    let weekSunday=
      addDays(
        weekMonday,
        6
      );
    let firstWeekText=
      formatDateShort(
        weekMonday
      );
    let lastWeekText=
      formatDateShort(
        weekSunday
      );

    html+=
      `<div class="plan-week">
        <div class="plan-week-title">
          ${firstWeekText} ～ ${lastWeekText}
        </div>
        <div class="plan-grid">
          <div class="plan-corner"></div>`;

    for(
      let i=0;
      i<7;
      i++
    ){
      let day=
        addDays(
          weekMonday,
          i
        );
      let key=
        fmt(day);
      let insideRange=
        day>=start&&
        day<end;
      html+=
        `<div class="plan-day-header ${
          insideRange
            ? ""
            : "outside"
        }">
          <span class="weekday">
            星期${days[i]}
          </span>
          <span class="date">
            ${key}
          </span>
        </div>`;
    }

    const pxPerHalfHour=24;
    const gridHeight=
      40*pxPerHalfHour;

    html+=
      `<div
        class="plan-time-axis"
        style="height:${gridHeight}px">`;

    for(
      let slot=0;
      slot<=40;
      slot++
    ){
      if(slot%2!==0)continue;
      let top=
        slot*pxPerHalfHour;
      let label=
        formatTimelineTime(slot);
      let transform=
        slot===0
          ? "translateY(0)"
          : slot===40
            ? "translateY(-100%)"
            : "translateY(-50%)";
      html+=
        `<div
          class="plan-time-label"
          style="top:${top}px;transform:${transform}">
          ${label}
        </div>`;
    }

    html+=
      '</div>';

    html+=
      `<div
        class="plan-days-area"
        style="height:${gridHeight}px">`;

    for(
      let i=0;
      i<7;
      i++
    ){
      let day=
        addDays(
          weekMonday,
          i
        );
      let key=
        fmt(day);
      let insideRange=
        day>=start&&
        day<end;

      html+=
        `<div
          class="plan-day-column ${
            insideRange
              ? ""
              : "outside"
          }">
          <div
            class="plan-grid-area"
            style="height:${gridHeight}px">`;

      for(
        let slot=0;
        slot<=40;
        slot+=2
      ){
        let top=
          slot*pxPerHalfHour;
        html+=
          `<div
            class="plan-hour-line"
            style="top:${top}px">
          </div>`;
      }

      for(
        let slot=1;
        slot<40;
        slot+=2
      ){
        let top=
          slot*pxPerHalfHour;
        html+=
          `<div
            class="plan-half-line"
            style="top:${top}px">
          </div>`;
      }

      if(insideRange){
        let list=
          displayEvents[key]||[];

        list.forEach(
          e=>{
            const top=
              (
                Number(e.startMinutes)-360
              )/
              30*
              pxPerHalfHour;
            const rawHeight=
              (
                Number(e.endMinutes)-
                Number(e.startMinutes)
              )/
              30*
              pxPerHalfHour;
            const safeTop=
              Math.max(
                0,
                Math.min(
                  top,
                  gridHeight
                )
              );
            const safeHeight=
              Math.max(
                8,
                Math.min(
                  rawHeight,
                  gridHeight-safeTop
                )
              );

            let subjectClass=
              e.subjectIndex<10
                ? `subject-${e.subjectIndex}`
                : "subject-other";

            html+=
              `<div
                class="plan-event ${subjectClass}"
                style="
                  top:${safeTop}px;
                  height:${safeHeight}px;
                ">
                <b>
                  ${esc(e.startTime)}–${esc(e.endTime)}
                </b>
                <span class="event-name">
                  ${esc(e.name)}
                </span>
                <span class="event-type">
                  ${esc(e.type)} · ${Number(e.hours).toFixed(1)}h
                </span>
              </div>`;
          }
        );
      }

      html+=
        `</div>
        </div>`;
    }

    html+=
      '</div>';
    html+=
      '</div>';
    html+=
      '</div>';
  }

  html+=
    '</div>';

  if(data.subjects.length){
    html+=
      '<div class="plan-legend">';

    data.subjects.forEach(
      (s,i)=>{
        let cls=
          i<10
            ? `subject-${i}`
            : "subject-other";

        html+=
          `<div class="plan-legend-item">
            <span
              class="plan-legend-dot ${cls}">
            </span>
            <span>
              ${esc(s.name)}
            </span>
          </div>`;
      }
    );

    html+=
      '</div>';
  }

  html+=
    '</div>';

  document.getElementById(
    "planOutput"
  ).innerHTML=
    html;
}
